name: Basic checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Python source syntax
        run: python3 -c 'import ast, pathlib; ast.parse(pathlib.Path("relay/pipewire-relay.py").read_text())'